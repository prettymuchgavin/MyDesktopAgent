# ==============================================================================
# My Desktop Agent — Configuration Template
# ==============================================================================

# Agent Identity & Persona
agent:
  name: "My Desktop Agent"
  persona_prompt: >
    You are My Desktop Agent, an autonomous, highly capable, and proactive desktop AI assistant.
    You assist the user by autonomously executing desktop tasks, writing content, organizing files,
    navigating applications, and running terminal workflows.

# LLM & Vision Provider Settings
ollama:
  provider: "ollama"                         # Options: "ollama", "openai", "openrouter", "groq", "custom"
  host: "http://localhost:11434"             # Ollama endpoint
  api_key: ""                                # API key for cloud providers (sk-..., gsk_...)
  base_url: ""                               # Cloud endpoint base URL (if custom)
  text_model: "gemma4:31b-cloud"             # Default reasoning model
  vision_model: "gemma4:31b-cloud"           # Default screen perception model
  temperature: 0.7

# Desktop Automation & Screen Perception
desktop_agent:
  vision_interval_sec: 2.0                   # Screen capture & inference cycle cadence
  action_delay_sec: 0.1                      # Humanized micro-delay between mouse/keyboard actions
  control_mode: "AUTO_DETECT"                # Options: "AUTO_DETECT", "POINT_AND_CLICK", "FULL_INPUT"
  enable_desktop_inputs: true                # Enable PyAutoGUI mouse and keyboard execution
  monitor_index: 1                           # 0 = All monitors combined, 1 = Primary, 2 = Secondary
  emergency_hotkey: "f12"                    # Press F12 anytime to immediately pause/resume agent
  window_title: ""

# Fast Direct Tools & Safety
tools:
  enable_terminal_commands: true             # Enable PowerShell / CMD shell command execution
  terminal_timeout_sec: 20.0                 # Timeout for individual terminal commands

# Push-to-Talk Hands-Free Voice Input
voice_input:
  enable_voice_input: true                   # Enable global microphone voice commands
  voice_input_hotkey: "alt+a"                # Press Alt+A or F8 to speak tasks hands-free

# Text-to-Speech Voice Engine
tts:
  engine: "kokoro-onnx"                      # Options: "kokoro-onnx", "elevenlabs", "none"
  voice: "af_sarah"                          # Kokoro voice name
  speed: 1.1                                 # Speech rate
  sample_rate: 24000
  elevenlabs:
    api_key: ""
    voice_id: ""

# Telegram Remote Control Bot
telegram:
  enabled: false                             # Set to true to control PC from your phone
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"  # Obtained from @BotFather
  allowed_user_ids:                          # Strict whitelist of authorized numeric user IDs
    - "YOUR_NUMERIC_USER_ID_HERE"

# Local Knowledge Base & Markdown Skills
knowledge:
  directory: "data/knowledge"
skills:
  directory: "skills"
scheduler:
  enabled: true

# Web Dashboard Server
web_dashboard:
  host: "127.0.0.1"
  port: 8000
